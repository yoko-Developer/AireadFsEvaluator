[pytest]
# pytestの設定ファイル

# テストの検索パターン
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# テスト実行のオプション
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# テストディレクトリ
testpaths = tests

# マーカーの定義
markers =
    unit: ユニットテスト
    integration: 統合テスト
    slow: 実行に時間がかかるテスト

# 警告の処理
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
