<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airead Evaluation Summary 🌸</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff7bd5;
            font-size: 2.5em;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #8E5F69;
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        .summary-box {
            background: #1e1e1e;
            padding: 20px 40px;
            border-radius: 12px;
            border: 2px solid #ff7bd5;
            box-shadow: 0 4px 20px rgba(255, 123, 213, 0.15);
            margin-bottom: 30px;
            display: flex;
            gap: 40px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #ffffff;
        }
        .stat-value.pink {
            color: #ff7bd5;
        }
        .stat-label {
            font-size: 0.8em;
            color: #8E5F69;
            text-transform: uppercase;
            margin-top: 5px;
        }
        table {
            width: 100%;
            max-width: 800px;
            border-collapse: collapse;
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2d2d2d;
        }
        th {
            background-color: #241a1e;
            color: #ff7bd5;
            text-align: left;
            padding: 12px 15px;
            font-size: 0.9em;
            letter-spacing: 1px;
            border-bottom: 2px solid #ff7bd5;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #2d2d2d;
            font-size: 0.95em;
        }
        tr:hover {
            background-color: #252525;
        }
        .result-ok {
            color: #00ff88;
            font-weight: bold;
        }
        .result-ng {
            color: #ff4560;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Evaluation Summary</h1>
    <div class="subtitle">Airead Round-up Test Report</div>
    
    <div class="summary-box">
        <div class="stat">
            <div class="stat-value">1</div>
            <div class="stat-label">Total Cases</div>
        </div>
        <div class="stat">
            <div class="stat-value">0</div>
            <div class="stat-label">Passed</div>
        </div>
        <div class="stat">
            <div class="stat-value pink">0.0%</div>
            <div class="stat-label">Accuracy</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 10%;">No</th>
                <th style="width: 40%;">Correct Answer (正解)</th>
                <th style="width: 40%;">Recognized (読み取り)</th>
                <th style="width: 10%;">Result</th>
            </tr>
        </thead>
        <tbody>
            
                <tr>
                    <td>1</td>
                    <td>不明</td>
                    <td>不明</td>
                    <td class="result-ng">✖</td>
                </tr>
                
        </tbody>
    </table>
</body>
</html>
