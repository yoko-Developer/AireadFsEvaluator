<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airead 比較結果</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #ff7bd5;
            font-size: 3em;
            margin-bottom: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(255, 123, 213, 0.2);
            border: 2px solid #ff7bd5;
        }
        .badge {
            display: inline-block;
            background-color: #ff7bd5;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>読込完了</h1>
        <p>テスト結果表示</p>
        <div class="badge">正解率 100%</div>
    </div>
</body>
</html>
